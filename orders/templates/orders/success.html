{% extends 'base.html' %}

{% block title %}Order Successful - Kwari Market{% endblock %}

{% block content %}
<div class="container text-center" style="padding: 10vh 0; min-height: 60vh;">
    <i class="bi bi-bag-check-fill text-success" style="font-size: 5rem;"></i>
    <h1 class="mt-4 fw-bold" style="color: #1a2332;">Thank You For Your Order!</h1>
    <p class="text-muted mb-4 fs-5">Your order has been placed successfully. We are preparing it for delivery.</p>
    
    <div class="d-flex justify-content-center gap-3 mt-4">
        <a href="{% url 'products:product_list' %}" class="btn text-white" style="background-color: #c99455; padding: 0.75rem 2rem; border-radius: 8px; font-weight: bold;">
            Continue Shopping
        </a>
        <a href="{% url 'accounts:dashboard' %}" class="btn btn-outline-secondary" style="padding: 0.75rem 2rem; border-radius: 8px; font-weight: bold;">
            View My Orders
        </a>
    </div>
</div>
{% endblock %}
