{% extends 'base.html' %}

{% block title %}Password Reset Complete - Kwari Market{% endblock %}

{% block content %}
<div class="container text-center" style="padding: 10vh 0; min-height: 60vh;">
    <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
    <h2 class="mt-4 fw-bold" style="color: #1a2332;">Password Reset Complete</h2>
    <p class="text-muted mb-4">Your password has been successfully set. You may go ahead and log in now.</p>
    <a href="{% url 'accounts:login' %}" class="btn" style="background-color: #c99455; color: white; padding: 0.75rem 2rem; border-radius: 8px; font-weight: bold; text-decoration: none;">
        Log In Now
    </a>
</div>
{% endblock %}
